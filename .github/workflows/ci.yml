name: CI

on:
  push:
    branches: [main, feat/*]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/api
          - packages/shared
          - packages/fc-provider
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'

      - name: Download dependencies
        working-directory: ${{ matrix.package }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: go test -v ./...
        env:
          FC_ACCESS_KEY_ID: ${{ secrets.FC_ACCESS_KEY_ID }}
          FC_ACCESS_KEY_SECRET: ${{ secrets.FC_ACCESS_KEY_SECRET }}
          FC_ACCOUNT_ID: ${{ secrets.FC_ACCOUNT_ID }}
          FC_REGION: ${{ vars.FC_REGION || 'cn-hangzhou' }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: packages/api