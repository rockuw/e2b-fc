name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Go dependencies
        run: |
          cd packages/api && go mod download

      - name: Run Go unit tests
        run: |
          cd packages/api && go test -v ./internal/provider/...

      - name: Install Python test dependencies
        run: |
          pip install -r tests/e2e/requirements.txt

      - name: Run E2E SDK compatibility tests
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2BFC_BASE_URL: ${{ vars.E2BFC_BASE_URL || 'http://localhost:8080' }}
        run: |
          pytest tests/e2e/test_e2b_sdk.py -v --tb=short || echo "E2E tests skipped - requires running service"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: packages/api

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build API
        run: |
          cd packages/api && go build -v ./...